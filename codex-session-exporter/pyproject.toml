[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-exporter"
version = "0.1.0"
description = "Manually export selected Codex JSONL sessions to Obsidian Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
codex-session-exporter = "codex_session_exporter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
